name: anphat-rag-local
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [internal]

  pull-models:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen3:4b && ollama pull bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    environment:
      RAG_DATA_DIR: /app/data
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: qwen3:4b
      OLLAMA_EMBED_MODEL: bge-m3
      RAG_MIN_RELEVANCE: ${RAG_MIN_RELEVANCE:-0.38}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Quản trị An Phát}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Specify admin email in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Specify strong admin password in .env}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - app_data:/app/data
      - ./results:/app/data/reports
    depends_on:
      pull-models:
        condition: service_completed_successfully
    networks: [internal]

networks:
  internal:
    driver: bridge
volumes:
  app_data:
  ollama_models:
